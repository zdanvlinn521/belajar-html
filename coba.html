<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- 1. INTERNAL CSS: ditulis langsung di atribut style elemen -->
  <h1 style="color: blue; font-size: 28px;">Judul dengan inline CSS</h1>
  <p style="color: gray; margin: 10px;">Paragraf dengan inline style.</p>

  <!-- 2. INTERNAL CSS: ditulis di dalam tag <style> di bagian head -->
  <head>
    <style>
      h1 {
        color: #1A5276;
        text-align: center; 
       }
      p {
        font-size: 16px;
        line-height: 1.8;
      }
  </style>
</body>
</html>
